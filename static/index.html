<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wine Quality Atelier</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Wine Quality Atelier home">
          <span class="brand-mark"></span>
          <span>
            <strong>Wine Quality Atelier</strong>
            <small>Reserve prediction console</small>
          </span>
        </a>
        <div class="status-line" id="healthStatus">Cellar warming</div>
      </header>

      <main class="workspace">
        <section class="control-panel">
          <div class="panel-heading">
            <p class="eyebrow">Red wine chemistry</p>
            <h1>Curate the profile.</h1>
          </div>

          <div class="preset-strip" id="presetStrip" aria-label="Vintage presets"></div>

          <form id="predictionForm" class="feature-list">
            <div id="featureControls"></div>
            <button class="primary-action" type="submit">
              <span>Evaluate Vintage</span>
              <span class="action-line"></span>
            </button>
          </form>
        </section>

        <section class="result-panel">
          <div class="cellar-visual" aria-hidden="true">
            <img src="/static/assets/cellar.png" alt="" />
          </div>

          <div class="result-band">
            <div>
              <p class="eyebrow">Model verdict</p>
              <h2 id="tierName">Awaiting pour</h2>
            </div>
            <div class="score-lockup">
              <span id="probabilityValue">--</span>
              <small>reserve probability</small>
            </div>
          </div>

          <div class="quality-meter" aria-label="Reserve probability">
            <span id="qualityMeterFill"></span>
          </div>

          <div class="quality-grid">
            <div>
              <span class="metric-label">Predicted quality</span>
              <strong id="qualityValue">--</strong>
            </div>
            <div>
              <span class="metric-label">Accuracy</span>
              <strong id="accuracyValue">--</strong>
            </div>
            <div>
              <span class="metric-label">ROC AUC</span>
              <strong id="rocValue">--</strong>
            </div>
          </div>

          <div class="notes" id="tastingNotes"></div>

          <div class="importance-panel">
            <div class="section-title">
              <span></span>
              <h3>Signal structure</h3>
            </div>
            <div id="importanceList" class="importance-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
